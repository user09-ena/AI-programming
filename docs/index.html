<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぷよぷよ風ゲーム</title>
    <style>
        /* スタイル定義 */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            flex-direction: column;
        }

        #game-container {
            display: flex;
            gap: 20px;
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #board {
            width: 300px;
            height: 600px;
            background-color: #111;
            border: 2px solid #555;
            position: relative;
            overflow: hidden;
        }

        /* ぷよ（ブロック）のスタイル */
        .puyo {
            width: 50px;
            height: 50px;
            position: absolute;
            border-radius: 50%;
            box-sizing: border-box;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3), inset 5px 5px 10px rgba(255,255,255,0.3);
            transition: top 0.1s linear, left 0.1s linear; /* 滑らかな移動のため */
        }

        /* ぷよの色 */
        .color-1 { background-color: #ff4d4d; } /* 赤 */
        .color-2 { background-color: #4dff4d; } /* 緑 */
        .color-3 { background-color: #4d4dff; } /* 青 */
        .color-4 { background-color: #ffff4d; } /* 黄 */

        #info-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
            width: 150px;
        }
        
        .panel-box {
            background-color: #222;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: center;
        }

        #next-puyo-display {
            width: 100px;
            height: 150px;
            margin: 10px auto;
            position: relative;
        }

        #score, #chain {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        #game-over-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1>ぷよぷよ風ゲーム</h1>
    
    <div id="game-container">
        <!-- ゲームボード -->
        <div id="board">
            <div id="game-over-message">
                <h2>ゲームオーバー</h2>
                <p>スコア: <span id="final-score">0</span></p>
                <button onclick="startGame()">もう一度プレイ</button>
            </div>
        </div>

        <!-- 情報パネル -->
        <div id="info-panel">
            <div class="panel-box">
                <div>NEXT</div>
                <div id="next-puyo-display"></div>
            </div>
            <div class="panel-box">
                <div>SCORE</div>
                <div id="score">0</div>
            </div>
            <div class="panel-box">
                <div>CHAIN</div>
                <div id="chain">0</div>
            </div>
        </div>
    </div>

    <!-- 操作ボタン（モバイル用簡易ボタン、キーボードでも操作可能） -->
    <div class="controls">
        <button onclick="moveLeft()">← 左</button>
        <button onclick="rotate()">回転</button>
        <button onclick="moveRight()">右 →</button>
        <button onclick="dropFast()">↓ 落下</button>
    </div>

    <script>
        // --- 定数と設定 ---
        const COLS = 6;           // ボードの列数
        const ROWS = 12;          // ボードの行数
        const CELL_SIZE = 50;     // 1セルのピクセルサイズ
        const COLORS = 4;         // ぷよの色の数 (1~4)
        const CONNECT_TO_ERASE = 4; // 消えるために必要な連結数

        // --- ゲーム状態変数 ---
        let boardData = [];       // ボードの状態を保持する2次元配列 (0:空, 1~4:色)
        let currentPuyo = null;   // 現在操作中のぷよのペア
        let nextPuyoColor = [];   // 次に降ってくるぷよの色ペア
        let score = 0;            // 現在のスコア
        let gameInterval = null;  // 落下ループ用のインターバルID
        let isProcessing = false; // 連鎖処理中フラグ（操作ブロック用）
        let fallSpeed = 1000;     // 基本落下速度（ミリ秒）

        // DOM要素の取得
        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const chainEl = document.getElementById('chain');
        const nextDisplayEl = document.getElementById('next-puyo-display');
        const gameOverMsg = document.getElementById('game-over-message');
        const finalScoreEl = document.getElementById('final-score');

        // --- STREAMING_CHUNK:ゲームの初期化関数... ---
        function initBoard() {
            // ボードデータを0(空)で初期化
            boardData = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            // 画面上の既存のぷよ要素をすべて削除（ゲームオーバー表示は残す）
            const puyos = boardEl.querySelectorAll('.puyo');
            puyos.forEach(p => p.remove());
        }

        // ランダムな色(1~4)を生成
        function getRandomColor() {
            return Math.floor(Math.random() * COLORS) + 1;
        }

        // 次のぷよを生成して表示を更新
        function generateNextPuyo() {
            if (nextPuyoColor.length === 0) {
                // 初回のみ2回生成
                nextPuyoColor = [getRandomColor(), getRandomColor()];
            }
            const currentColors = [...nextPuyoColor];
            nextPuyoColor = [getRandomColor(), getRandomColor()];
            updateNextDisplay();
            return currentColors;
        }

        function updateNextDisplay() {
            nextDisplayEl.innerHTML = ''; // クリア
            const p1 = createPuyoElement(nextPuyoColor[0]);
            p1.style.top = '10px';
            p1.style.left = '25px';
            
            const p2 = createPuyoElement(nextPuyoColor[1]);
            p2.style.top = '70px';
            p2.style.left = '25px';
            
            nextDisplayEl.appendChild(p1);
            nextDisplayEl.appendChild(p2);
        }

        // DOM要素としてぷよを作成
        function createPuyoElement(colorIndex) {
            const el = document.createElement('div');
            el.className = `puyo color-${colorIndex}`;
            return el;
        }

        // --- STREAMING_CHUNK:操作ブロック(ペア)の管理... ---
        // 新しいぷよペアを盤面の上部にスポーンさせる
        function spawnPuyo() {
            const colors = generateNextPuyo();
            
            // 操作中のペアのデータ構造
            // メイン(軸)のぷよと、サブ(回転する)ぷよ
            currentPuyo = {
                main: { x: 2, y: 1, color: colors[0], el: createPuyoElement(colors[0]) }, // 軸 (下)
                sub: { x: 2, y: 0, color: colors[1], el: createPuyoElement(colors[1]) },   // サブ (上)
                rotation: 0 // 0:上, 1:右, 2:下, 3:左
            };

            boardEl.appendChild(currentPuyo.main.el);
            boardEl.appendChild(currentPuyo.sub.el);
            
            updatePuyoPosition();

            // スポーン位置にすでにブロックがあればゲームオーバー
            if (boardData[currentPuyo.main.y][currentPuyo.main.x] !== 0 || 
                boardData[currentPuyo.sub.y][currentPuyo.sub.x] !== 0) {
                gameOver();
            }
        }

        // 操作中ぷよの画面上の位置を更新
        function updatePuyoPosition() {
            if (!currentPuyo) return;
            currentPuyo.main.el.style.left = currentPuyo.main.x * CELL_SIZE + 'px';
            currentPuyo.main.el.style.top = currentPuyo.main.y * CELL_SIZE + 'px';
            currentPuyo.sub.el.style.left = currentPuyo.sub.x * CELL_SIZE + 'px';
            currentPuyo.sub.el.style.top = currentPuyo.sub.y * CELL_SIZE + 'px';
        }

        // 指定した座標がボード内かつ空いているかチェック
        function isValidPosition(p1_x, p1_y, p2_x, p2_y) {
            return p1_x >= 0 && p1_x < COLS && p1_y >= 0 && p1_y < ROWS && boardData[p1_y][p1_x] === 0 &&
                   p2_x >= 0 && p2_x < COLS && p2_y >= 0 && p2_y < ROWS && boardData[p2_y][p2_x] === 0;
        }

        // --- STREAMING_CHUNK:プレイヤーの操作関数... ---
        function moveLeft() {
            if (isProcessing || !currentPuyo) return;
            if (isValidPosition(currentPuyo.main.x - 1, currentPuyo.main.y, currentPuyo.sub.x - 1, currentPuyo.sub.y)) {
                currentPuyo.main.x--;
                currentPuyo.sub.x--;
                updatePuyoPosition();
            }
        }

        function moveRight() {
            if (isProcessing || !currentPuyo) return;
            if (isValidPosition(currentPuyo.main.x + 1, currentPuyo.main.y, currentPuyo.sub.x + 1, currentPuyo.sub.y)) {
                currentPuyo.main.x++;
                currentPuyo.sub.x++;
                updatePuyoPosition();
            }
        }

        // 回転処理（右回転）
        function rotate() {
            if (isProcessing || !currentPuyo) return;
            
            const nextRot = (currentPuyo.rotation + 1) % 4;
            let nextSubX = currentPuyo.main.x;
            let nextSubY = currentPuyo.main.y;

            // main(軸)を基準にしたsubの相対位置を計算
            if (nextRot === 0) { nextSubY -= 1; } // 上
            if (nextRot === 1) { nextSubX += 1; } // 右
            if (nextRot === 2) { nextSubY += 1; } // 下
            if (nextRot === 3) { nextSubX -= 1; } // 左

            // 回転先が壁や他のブロックの場合の簡単な壁蹴り（1マス横にずらす）
            let mainX = currentPuyo.main.x;
            if (nextSubX < 0) { mainX++; nextSubX++; } // 左壁
            else if (nextSubX >= COLS) { mainX--; nextSubX--; } // 右壁

            if (isValidPosition(mainX, currentPuyo.main.y, nextSubX, nextSubY)) {
                currentPuyo.main.x = mainX;
                currentPuyo.sub.x = nextSubX;
                currentPuyo.sub.y = nextSubY;
                currentPuyo.rotation = nextRot;
                updatePuyoPosition();
            }
        }

        // 下へ1マス移動。移動できなければ固定（ロック）処理へ
        function moveDown() {
            if (isProcessing || !currentPuyo) return false;
            
            if (isValidPosition(currentPuyo.main.x, currentPuyo.main.y + 1, currentPuyo.sub.x, currentPuyo.sub.y + 1)) {
                currentPuyo.main.y++;
                currentPuyo.sub.y++;
                updatePuyoPosition();
                return true;
            } else {
                // 底についた、または他のブロックに乗った
                lockPuyo();
                return false;
            }
        }

        function dropFast() {
            if (isProcessing || !currentPuyo) return;
            while(moveDown()) {
                // 下に行けなくなるまでループ
            }
        }

        // --- STREAMING_CHUNK:盤面への固定と落下・連鎖処理... ---
        // 操作ブロックを盤面データ(boardData)に書き込む
        async function lockPuyo() {
            isProcessing = true; // 処理中は操作無効
            clearInterval(gameInterval); // 自動落下を一時停止

            // DOM要素を一度外す（再描画のため）
            currentPuyo.main.el.remove();
            currentPuyo.sub.el.remove();

            // 盤面データに色を記録
            // 注意: y座標が範囲外(0未満)の場合はゲームオーバーとするか無視するが、今回はシンプルに配列に収まるようにしている前提
            if(currentPuyo.main.y >= 0) boardData[currentPuyo.main.y][currentPuyo.main.x] = currentPuyo.main.color;
            if(currentPuyo.sub.y >= 0)  boardData[currentPuyo.sub.y][currentPuyo.sub.x] = currentPuyo.sub.color;

            currentPuyo = null;
            
            // 落下処理と連鎖処理のループを開始
            await processGravityAndChains();
        }

        // 盤面の描画（boardDataに基づいてDOMを再構築）
        function renderBoard() {
            // 操作ブロック以外のぷよをすべて削除
            const existingPuyos = boardEl.querySelectorAll('.puyo:not([id])'); // id付きは除外するなどの工夫も可能だが今回はすべて再生成
            existingPuyos.forEach(p => p.remove());

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const color = boardData[y][x];
                    if (color !== 0) {
                        const puyoEl = createPuyoElement(color);
                        puyoEl.style.left = x * CELL_SIZE + 'px';
                        puyoEl.style.top = y * CELL_SIZE + 'px';
                        boardEl.appendChild(puyoEl);
                    }
                }
            }
        }

        // 浮いているぷよを落下させる処理
        async function applyGravity() {
            let moved = false;
            // 下から上に向かってチェック
            for (let x = 0; x < COLS; x++) {
                for (let y = ROWS - 2; y >= 0; y--) { // 一番下の行は落ちないので -2 から
                    if (boardData[y][x] !== 0) {
                        let fallY = y;
                        // 下が空いている限り落下先を探す
                        while (fallY + 1 < ROWS && boardData[fallY + 1][x] === 0) {
                            fallY++;
                        }
                        if (fallY !== y) {
                            // 移動
                            boardData[fallY][x] = boardData[y][x];
                            boardData[y][x] = 0;
                            moved = true;
                        }
                    }
                }
            }
            if (moved) {
                renderBoard();
                // 落下アニメーションを見せるためのウェイト
                await new Promise(r => setTimeout(r, 200)); 
            }
            return moved;
        }

        // 連結しているぷよを探して消す処理
        async function checkAndErase() {
            let erased = false;
            let eraseCount = 0;
            // 削除予定の座標を記録する配列（直接消すと連結判定がおかしくなるため）
            let toErase = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            let visited = Array(ROWS).fill().map(() => Array(COLS).fill(false));

            // 再帰的に繋がっている同色ぷよを探す関数（深さ優先探索）
            function findConnected(x, y, color) {
                if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return [];
                if (visited[y][x] || boardData[y][x] !== color) return [];

                visited[y][x] = true;
                let connected = [{x, y}];

                // 上下左右をチェック
                connected = connected.concat(findConnected(x, y - 1, color)); // 上
                connected = connected.concat(findConnected(x, y + 1, color)); // 下
                connected = connected.concat(findConnected(x - 1, y, color)); // 左
                connected = connected.concat(findConnected(x + 1, y, color)); // 右

                return connected;
            }

            // 全マスを走査して連結をチェック
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const color = boardData[y][x];
                    if (color !== 0 && !visited[y][x]) {
                        const connectedPuyos = findConnected(x, y, color);
                        // 連結数が規定値(4)以上なら消去対象にする
                        if (connectedPuyos.length >= CONNECT_TO_ERASE) {
                            connectedPuyos.forEach(p => {
                                toErase[p.y][p.x] = true;
                            });
                            erased = true;
                            eraseCount += connectedPuyos.length;
                        }
                    }
                }
            }

            if (erased) {
                // 対象を消去 (データを0にする)
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (toErase[y][x]) {
                            boardData[y][x] = 0;
                        }
                    }
                }
                renderBoard();
                await new Promise(r => setTimeout(r, 300)); // 消えたことを見せるウェイト
                return eraseCount; // 消えた数を返す
            }
            return 0; // 消えなかった
        }

        // 落下と消去を連鎖が止まるまで繰り返すメイン処理
        async function processGravityAndChains() {
            let chainCount = 0;
            chainEl.textContent = chainCount;
            
            // まず浮いているものを落とす
            await applyGravity();

            while (true) {
                const erasedAmount = await checkAndErase();
                if (erasedAmount > 0) {
                    chainCount++;
                    chainEl.textContent = chainCount;
                    // スコア計算 (消えた数 * 10 * 連鎖ボーナス)
                    score += erasedAmount * 10 * chainCount;
                    scoreEl.textContent = score;

                    // 消えた空間に上のぷよを落とす
                    await applyGravity();
                } else {
                    // もう消えるものがない
                    break;
                }
            }

            // 連鎖処理終了。次のぷよをスポーン
            isProcessing = false;
            // ゲームオーバー判定
            if(boardData[0][2] !== 0 || boardData[1][2] !== 0) {
                 gameOver();
                 return;
            }

            spawnPuyo();
            gameInterval = setInterval(gameLoop, fallSpeed); // 落下再開
        }

        // --- STREAMING_CHUNK:ゲーム進行とイベント制御... ---
        function gameLoop() {
            moveDown();
        }

        function gameOver() {
            clearInterval(gameInterval);
            isProcessing = true;
            gameOverMsg.style.display = 'block';
            finalScoreEl.textContent = score;
        }

        function startGame() {
            initBoard();
            score = 0;
            scoreEl.textContent = score;
            chainEl.textContent = 0;
            gameOverMsg.style.display = 'none';
            nextPuyoColor = []; // ネクストをリセット
            isProcessing = false;

            spawnPuyo();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, fallSpeed);
        }

        // キーボード操作のイベントリスナー
        document.addEventListener('keydown', (e) => {
            // デフォルトのスクロール動作を防ぐ（特に矢印キー）
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight", " "].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowRight':
                    moveRight();
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case 'ArrowUp':
                case ' ': // スペースキーでも回転
                    rotate();
                    break;
            }
        });

        // ページ読み込み時にゲーム開始
        window.onload = () => {
            startGame();
        };

    </script>
</body>
</html>
